<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quanto Sei Libero nelle Tue Scelte? | Uno Come Voi</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1623;
    --card: #1a2236;
    --card2: #1e2a40;
    --accent: #4f8ef7;
    --accent2: #7bb3ff;
    --accent-glow: rgba(79,142,247,0.18);
    --text: #e8eef8;
    --text-muted: #8da0be;
    --border: rgba(79,142,247,0.18);
    --success: #4fd1a0;
    --danger: #f76f6f;
    --bar-bg: rgba(79,142,247,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 60px;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(79,142,247,0.07) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, rgba(123,179,255,0.05) 0%, transparent 60%);
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
    margin-top: 16px;
  }

  .brand {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    opacity: 0.9;
  }

  .caffè-number {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 7vw, 46px);
    font-weight: 900;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 14px;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 400px;
    margin: 0 auto;
  }

  /* QUIZ CARD */
  .quiz-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(79,142,247,0.06);
  }

  /* PROGRESS */
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .q-counter {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .progress-bar-wrap {
    flex: 1;
    height: 4px;
    background: var(--bar-bg);
    border-radius: 99px;
    margin: 0 14px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .q-score {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
  }

  /* QUESTION */
  .question-block {
    animation: fadeUp 0.35s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-num {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .q-scenario-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .q-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 4vw, 19px);
    font-weight: 700;
    line-height: 1.45;
    color: var(--text);
    margin-bottom: 26px;
  }

  /* OPTIONS */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    background: var(--card2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    text-align: left;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    transition: all 0.2s ease;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }

  .option-btn:hover {
    border-color: var(--accent);
    background: rgba(79,142,247,0.08);
    transform: translateX(3px);
  }

  .option-btn.selected {
    border-color: var(--accent);
    background: rgba(79,142,247,0.13);
    box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
  }

  .option-letter {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--bar-bg);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
  }

  .option-btn.selected .option-letter {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .option-text { flex: 1; }

  /* NEXT BUTTON */
  .next-btn {
    margin-top: 24px;
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 15px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: none;
    box-shadow: 0 4px 20px rgba(79,142,247,0.3);
  }

  .next-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(79,142,247,0.45);
  }

  .next-btn.visible { display: block; }

  /* RESULT */
  .result-block {
    display: none;
    animation: fadeUp 0.4s ease both;
  }

  .result-block.visible { display: block; }

  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(79,142,247,0.12);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 6px 16px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }

  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 900;
    line-height: 1.15;
    margin-bottom: 6px;
    color: var(--text);
  }

  .result-score-line {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .result-score-line strong {
    color: var(--accent);
  }

  .result-desc {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-muted);
    margin-bottom: 20px;
    border-left: 3px solid var(--accent);
    padding-left: 16px;
  }

  .result-action {
    background: rgba(79,142,247,0.07);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 24px;
  }

  .result-action strong {
    display: block;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .retry-btn {
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 24px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .retry-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* FOOTER */
  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.6;
  }

  .footer a {
    color: var(--accent);
    text-decoration: none;
    opacity: 0.8;
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">☕ Uno Come Voi</div>
  <div class="caffè-number">· Il test dell'articolo ·</div>
  <h1>Quanto sei libero/a<br><span>nelle tue scelte?</span></h1>
  <p class="subtitle">5 scenari concreti. Scopri se a scegliere sei tu, o i tuoi automatismi.</p>
</div>

<div class="quiz-card" id="quizCard">

  <!-- PROGRESS -->
  <div class="progress-row">
    <span class="q-counter" id="qCounter">Domanda 1 di 5</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <span class="q-score" id="scoreDisplay">0 pt</span>
  </div>

  <!-- QUESTION -->
  <div class="question-block" id="questionBlock">
    <div class="q-num" id="qNum">01 —</div>
    <div class="q-scenario-label">Scenario</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optionsContainer"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Prossima domanda →</button>
  </div>

  <!-- RESULT -->
  <div class="result-block" id="resultBlock">
    <div class="result-badge">🧠 Il tuo profilo</div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-score-line" id="resultScoreLine"></div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="result-action" id="resultAction"></div>
    <button class="retry-btn" onclick="restartQuiz()">↩ Rifai il test</button>
  </div>

</div>

<div class="footer">
  Con Affetto — Teo ☕ &nbsp;·&nbsp; <a href="https://uno-come-voi.com" target="_blank">uno-come-voi.com</a>
</div>

<script>
const questions = [
  {
    num: "01",
    scenario: "Scenario",
    text: "Qualcuno ti provoca e senti la rabbia salire in un secondo. Cosa succede?",
    options: [
      { letter: "A", text: "Esplodo: la reazione parte prima ancora che io possa pensarci.", points: 0 },
      { letter: "B", text: "Mi trattengo, ma poi ci rimugino sopra per ore.", points: 2 },
      { letter: "C", text: "Sento l'impulso arrivare, mi fermo un attimo e scelgo come rispondere.", points: 4 },
      { letter: "D", text: "Ingoio tutto e faccio finta di niente, come sempre.", points: 1 }
    ]
  },
  {
    num: "02",
    scenario: "Scenario",
    text: "Pensa a un tuo difetto, quello che ti rimproverano più spesso. Quale frase useresti per spiegarlo?",
    options: [
      { letter: "A", text: "\"Sono fatto/a così, non ci posso fare niente.\"", points: 0 },
      { letter: "B", text: "\"So da dove viene. E proprio perché lo so, posso lavorarci.\"", points: 4 },
      { letter: "C", text: "\"Ci provo a cambiare, ma alla fine ci ricado sempre.\"", points: 2 },
      { letter: "D", text: "\"È colpa di come sono cresciuto/a.\"", points: 1 }
    ]
  },
  {
    num: "03",
    scenario: "Scenario",
    text: "Sei davanti a un bivio importante: un lavoro, un trasloco, una relazione. Come scegli?",
    options: [
      { letter: "A", text: "Faccio quello che farebbe chiunque al mio posto: la scelta \"normale\".", points: 1 },
      { letter: "B", text: "Decido d'istinto e poi vedo come va.", points: 2 },
      { letter: "C", text: "Lascio che decidano gli altri, o il tempo.", points: 0 },
      { letter: "D", text: "Mi prendo il tempo per capire cosa voglio davvero, poi scelgo e mi prendo la responsabilità della scelta.", points: 4 }
    ]
  },
  {
    num: "04",
    scenario: "Scenario",
    text: "Le regole ti dicono di fare una cosa, ma il buon senso ti dice che è sbagliata. Cosa fai?",
    options: [
      { letter: "A", text: "Seguo le regole senza pensarci: se va male, non è colpa mia.", points: 0 },
      { letter: "B", text: "Rifletto, ma alla fine mi adeguo per paura di sbagliare.", points: 2 },
      { letter: "C", text: "Mi fermo, ragiono, e se ho buone ragioni trovo il coraggio di andare controcorrente.", points: 4 },
      { letter: "D", text: "Faccio di testa mia per principio, a prescindere.", points: 1 }
    ]
  },
  {
    num: "05",
    scenario: "Scenario",
    text: "Pensa a una tua giornata tipo. Quanto di quello che fai lo scegli davvero?",
    options: [
      { letter: "A", text: "Tutto: sono io il padrone assoluto della mia vita, nessuno mi condiziona.", points: 1 },
      { letter: "B", text: "Quasi niente: vado col pilota automatico tra lavoro, telefono e divano.", points: 0 },
      { letter: "C", text: "Molto: anche le mie abitudini, ogni tanto, le metto in discussione e mi chiedo se mi servono ancora.", points: 4 },
      { letter: "D", text: "Poco, ma almeno me ne rendo conto.", points: 2 }
    ]
  }
];

const results = [
  {
    min: 0, max: 4,
    title: "Il Pilota Automatico",
    desc: "Oggi le tue giornate le guidano soprattutto gli automatismi: reazioni, abitudini, le scelte degli altri. Non è colpa tua: il cervello è fatto apposta per risparmiare energia e decidere prima che tu te ne accorga. Ma la libertà non sparisce. È lì, in quella frazione di secondo in cui puoi dire \"no, aspetta\". Devi solo iniziare ad allenarla.",
    action: "⚡ La tua azione questa settimana: Scegli UN automatismo della tua giornata (il telefono appena sveglio/a, la risposta secca, il divano dopo cena). Ogni volta che sta per partire, fermati 5 secondi e chiediti: \"Lo sto scegliendo io?\". Solo questo."
  },
  {
    min: 5, max: 8,
    title: "Il Figlio delle Circostanze",
    desc: "Conosci bene le cause che ti hanno reso quello che sei: la famiglia, le esperienze, le ferite. Il rischio è che quelle cause diventino una giustificazione. Spiegare è sano. Giustificarsi ti blocca. Il passato ti ha formato, ma non ha firmato al posto tuo le scelte di oggi.",
    action: "⚡ La tua azione questa settimana: Prendi una frase che ti ripeti spesso, del tipo \"non posso perché...\". Riscrivila così: \"Ho reagito così perché..., e da oggi scelgo di...\". Trasforma una scusa in una spiegazione con un passo avanti."
  },
  {
    min: 9, max: 12,
    title: "Il Libero a Metà",
    desc: "Sai di poter scegliere e a volte lo fai davvero. Altre volte invece l'impulso, la paura o le abitudini vincono la partita. Sei esattamente nel mezzo: hai capito che la libertà esiste, ora si tratta di usarla con più costanza. La buona notizia? È un muscolo, e si allena.",
    action: "⚡ La tua azione questa settimana: Usa il tuo diritto di veto. La prossima volta che senti partire una reazione automatica, rabbia, \"sì\" detto per forza o rinvio, contalo come una vittoria anche solo fermarti prima. Annota ogni volta che ci riesci."
  },
  {
    min: 13, max: 16,
    title: "Il Guardiano del Veto",
    desc: "Hai imparato la forma più concreta di libertà: quella di fermarti. Senti gli impulsi, conosci i tuoi condizionamenti, ma non li lasci decidere da soli. Ti prendi la responsabilità delle tue scelte senza nasconderti dietro il passato. La consapevolezza per te non è teoria: è pratica quotidiana.",
    action: "⚡ La tua azione questa settimana: Ripensa a una scelta della tua vita che ha cambiato tutto, in bene. Raccontala a qualcuno, o scrivimela nei commenti o nel Forum. Ricordare quando hai scelto bene ti dà forza per i prossimi bivi."
  },
  {
    min: 17, max: 20,
    title: "Hai Preso la Pillola Rossa",
    desc: "Sai che non sei libero/a da tutto: geni, passato e circostanze esistono. Ma sai anche che dentro quei confini lo spazio per scegliere è enorme, e lo usi. Ti fermi, rifletti, e quando serve hai il coraggio di andare controcorrente. Questa è la libertà vera: non l'assenza di condizionamenti, ma la capacità di scegliere chi essere nonostante loro.",
    action: "⚡ La tua azione questa settimana: Usa questa libertà per una scelta coraggiosa che rimandi da tempo. Un \"no\" che non hai mai detto, un \"sì\" che ti spaventa. La libertà che non usi, alla lunga, si arrugginisce."
  }
];

let currentQ = 0;
let totalScore = 0;
let selectedPoints = null;

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('qCounter').textContent = `Domanda ${currentQ + 1} di ${questions.length}`;
  document.getElementById('qNum').textContent = q.num + ' —';
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressBar').style.width = `${(currentQ / questions.length) * 100}%`;
  document.getElementById('scoreDisplay').textContent = totalScore + ' pt';

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${opt.letter}</span><span class="option-text">${opt.text}</span>`;
    btn.onclick = () => selectOption(i, opt.points, btn);
    container.appendChild(btn);
  });

  selectedPoints = null;
  const nb = document.getElementById('nextBtn');
  nb.classList.remove('visible');
  nb.textContent = currentQ < questions.length - 1 ? 'Prossima domanda →' : 'Scopri il tuo profilo →';

  // re-animate
  const qb = document.getElementById('questionBlock');
  qb.style.animation = 'none';
  qb.offsetHeight;
  qb.style.animation = 'fadeUp 0.35s ease both';
}

function selectOption(index, points, btn) {
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedPoints = points;
  document.getElementById('nextBtn').classList.add('visible');
}

function nextQuestion() {
  if (selectedPoints === null) return;
  totalScore += selectedPoints;

  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('questionBlock').style.display = 'none';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('qCounter').textContent = `Completato!`;
  document.getElementById('scoreDisplay').textContent = totalScore + ' pt';

  const result = results.find(r => totalScore >= r.min && totalScore <= r.max) || results[results.length - 1];

  document.getElementById('resultTitle').textContent = result.title;
  document.getElementById('resultScoreLine').innerHTML = `Hai totalizzato <strong>${totalScore} punti</strong> su 20`;
  document.getElementById('resultDesc').textContent = result.desc;
  document.getElementById('resultAction').innerHTML = `<strong>⚡ La tua azione questa settimana</strong>${result.action.replace('⚡ La tua azione questa settimana: ', '')}`;

  const rb = document.getElementById('resultBlock');
  rb.classList.add('visible');
}

function restartQuiz() {
  currentQ = 0;
  totalScore = 0;
  selectedPoints = null;
  document.getElementById('questionBlock').style.display = 'block';
  document.getElementById('resultBlock').classList.remove('visible');
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
